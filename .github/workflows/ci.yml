name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        # Credenciales de prueba, efímeras del runner: no son secretos.
        env:
          POSTGRES_USER: erpadmin_ci
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: erpadmin_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erpadmin_ci -d erpadmin_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Instalar cliente de PostgreSQL si falta
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql --version

      - name: Crear esquema y cargar datos de ejemplo
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: erpadmin_ci
          PGPASSWORD: ci_only_password
          PGDATABASE: erpadmin_ci
        run: |
          psql -v ON_ERROR_STOP=1 -f db/init-schema.sql
          psql -v ON_ERROR_STOP=1 -f db/seed_chimu.sql

      - name: Compilar y ejecutar pruebas
        env:
          DB_URL: jdbc:postgresql://localhost:5432/erpadmin_ci
          DB_USERNAME: erpadmin_ci
          DB_PASSWORD: ci_only_password
        run: ./mvnw -B -ntp verify

      - name: Subir informes de pruebas
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports
          if-no-files-found: ignore
