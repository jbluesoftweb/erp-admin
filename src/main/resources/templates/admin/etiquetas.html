<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{layout :: head}"></th:block>
    <style>
        .page-card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-bottom: 25px;
            overflow: hidden;
        }
        .page-card-header {
            background: linear-gradient(90deg, #2d5016 0%, #3d6b1f 100%);
            padding: 14px 20px;
            border-left: 4px solid #d4af37;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .page-card-header span {
            color: white;
            font-size: 15px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .controls-bar {
            padding: 15px 20px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #555;
        }
        .data-table { width: 100%; border-collapse: collapse; }
        .data-table th {
            padding: 11px 14px;
            font-size: 11px;
            font-weight: 700;
            color: #495057;
            text-transform: uppercase;
            background: #f8f9fa;
            border-bottom: 2px solid #dee2e6;
            text-align: left;
        }
        .data-table td {
            padding: 10px 14px;
            font-size: 13px;
            border-bottom: 1px solid #e9ecef;
            vertical-align: middle;
        }
        .data-table tbody tr:hover { background: #f8f9fa; }
        .valor-defecto { color: #6c757d; }
        .input-valor {
            width: 100%;
            min-width: 180px;
            padding: 6px 10px;
            font-size: 13px;
            border: 1px solid #ced4da;
            border-radius: 3px;
        }
        .input-valor:focus { outline: none; border-color: #3d6b1f; box-shadow: 0 0 0 2px rgba(61,107,31,0.15); }
        .texto-secundario { color: #999; }
        .btn-accion {
            padding: 5px 12px;
            font-size: 12px;
            border-radius: 3px;
            border: none;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .btn-guardar { background: #2d5016; color: white; }
        .btn-guardar:hover { background: #3d6b1f; color: white; }
    </style>
</head>
<body>
<div th:replace="~{layout :: sidebar}"></div>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="main-wrapper">
    <div th:replace="~{layout :: header}"></div>
    <div class="content-area">

        <div th:if="${success}" class="alert-custom alert-success">
            <i class="bi bi-check-circle-fill"></i>
            <span th:text="${success}"></span>
        </div>
        <div th:if="${error}" class="alert-custom alert-danger">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span th:text="${error}"></span>
        </div>

        <div class="controls-bar">
            <i class="bi bi-info-circle-fill"></i>
            Deje el valor personalizado en blanco para usar el valor por defecto.
            Cada etiqueta se guarda por separado con su botón "Guardar".
        </div>

        <div class="page-card">
            <div class="page-card-header">
                <i class="bi bi-tags-fill" style="color:#d4af37;"></i>
                <span>Etiquetas del sistema</span>
            </div>
            <table class="data-table">
                <thead>
                <tr>
                    <th>Descripción</th>
                    <th>Valor por defecto</th>
                    <th>Valor personalizado</th>
                    <th>Última actualización</th>
                    <th>Actualizado por</th>
                    <th style="text-align:center;">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${listaEtiquetas.isEmpty()}">
                    <td colspan="6" style="text-align:center; color:#999; padding:30px;">
                        No hay etiquetas registradas.
                    </td>
                </tr>
                <!-- Un <form> no puede ser hijo directo de <tr>: el form va en la
                     celda de acciones y el input de texto se asocia con el atributo form -->
                <tr th:each="e, iter : ${listaEtiquetas}">
                    <td th:text="${e.descripcion ?: e.valorDefecto}"></td>
                    <td class="valor-defecto" th:text="${e.valorDefecto}"></td>
                    <td>
                        <input type="text" name="valorPersonalizado" class="input-valor"
                               maxlength="100"
                               th:attr="form=${'form-etiqueta-' + iter.index}"
                               th:value="${e.valorPersonalizado}"
                               th:placeholder="${e.valorDefecto}"/>
                    </td>
                    <td>
                        <span th:if="${e.updatedAt != null}"
                              th:text="${#temporals.format(e.updatedAt, 'dd-MM-yyyy HH:mm')}"></span>
                        <span th:if="${e.updatedAt == null}" class="texto-secundario">-</span>
                    </td>
                    <td>
                        <span th:if="${e.updatedBy != null}" th:text="${e.updatedBy}"></span>
                        <span th:if="${e.updatedBy == null}" class="texto-secundario">-</span>
                    </td>
                    <td style="text-align:center; white-space:nowrap;">
                        <!-- th:action agrega el token CSRF automáticamente -->
                        <form th:id="${'form-etiqueta-' + iter.index}"
                              th:action="@{/admin/etiquetas/actualizar}"
                              method="post" style="display:inline;">
                            <input type="hidden" name="clave" th:value="${e.clave}"/>
                            <button type="submit" class="btn-accion btn-guardar">
                                <i class="bi bi-save-fill"></i> Guardar
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

    </div>
</div>

<div th:replace="~{layout :: footer}"></div>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
