<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{layout :: head}"></th:block>
    <link th:href="@{/css/admin-etiquetas.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{layout :: sidebar}"></div>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="main-wrapper">
    <div th:replace="~{layout :: header}"></div>
    <div class="content-area">

        <div th:if="${success}" class="alert-custom alert-success">
            <i class="bi bi-check-circle-fill"></i>
            <span th:text="${success}"></span>
        </div>
        <div th:if="${error}" class="alert-custom alert-danger">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span th:text="${error}"></span>
        </div>

        <div class="alert-custom alert-info">
            <i class="bi bi-info-circle-fill" aria-hidden="true"></i>
            <span>
                Deje el valor personalizado en blanco para usar el valor por defecto.
                Cada etiqueta se guarda por separado con su botón "Guardar".
            </span>
        </div>

        <div class="page-card">
            <div class="page-card-header">
                <i class="bi bi-tags-fill" aria-hidden="true"></i>
                <span>Etiquetas del sistema</span>
            </div>
            <div class="data-table etiquetas-table">
            <table>
                <thead>
                <tr>
                    <th>Descripción</th>
                    <th>Valor por defecto</th>
                    <th>Valor personalizado</th>
                    <th>Última actualización</th>
                    <th>Actualizado por</th>
                    <th class="td-acciones">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${listaEtiquetas.isEmpty()}">
                    <td colspan="6" class="td-empty">
                        No hay etiquetas registradas.
                    </td>
                </tr>
                <!-- Un <form> no puede ser hijo directo de <tr>: el form va en la
                     celda de acciones y el input de texto se asocia con el atributo form -->
                <tr th:each="e, iter : ${listaEtiquetas}">
                    <td th:text="${e.descripcion ?: e.valorDefecto}"></td>
                    <td class="valor-defecto" th:text="${e.valorDefecto}"></td>
                    <td>
                        <input type="text" name="valorPersonalizado" class="form-control input-valor"
                               maxlength="100"
                               th:attr="form=${'form-etiqueta-' + iter.index}"
                               th:value="${e.valorPersonalizado}"
                               th:placeholder="${e.valorDefecto}"/>
                    </td>
                    <td>
                        <span th:if="${e.updatedAt != null}"
                              th:text="${#temporals.format(e.updatedAt, 'dd-MM-yyyy HH:mm')}"></span>
                        <span th:if="${e.updatedAt == null}" class="texto-secundario">-</span>
                    </td>
                    <td>
                        <span th:if="${e.updatedBy != null}" th:text="${e.updatedBy}"></span>
                        <span th:if="${e.updatedBy == null}" class="texto-secundario">-</span>
                    </td>
                    <td class="td-acciones">
                        <!-- th:action agrega el token CSRF automáticamente -->
                        <form th:id="${'form-etiqueta-' + iter.index}"
                              th:action="@{/admin/etiquetas/actualizar}"
                              method="post">
                            <input type="hidden" name="clave" th:value="${e.clave}"/>
                            <button type="submit" class="btn-institucional">
                                <i class="bi bi-save-fill" aria-hidden="true"></i> Guardar
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
            </div>
        </div>

    </div>
</div>

<div th:replace="~{layout :: footer}"></div>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
