<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ERP Admin</title>
    
    <!-- Bootstrap 5 CSS -->
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .login-container {
            max-width: 400px;
            width: 100%;
        }
        
        .login-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        
        .login-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .login-header h1 {
            font-size: 24px;
            font-weight: bold;
            margin: 0;
        }
        
        .login-header p {
            margin: 5px 0 0 0;
            opacity: 0.9;
            font-size: 14px;
        }
        
        .login-body {
            padding: 30px;
        }
        
        .form-label {
            font-weight: 600;
            color: #333;
        }
        
        .btn-login {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 12px;
            font-weight: bold;
            transition: transform 0.2s;
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .alert {
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <!-- Header -->
            <div class="login-header">
                <h1>Sistema de Asistencia</h1>
                <p>Sistema ERP Administrativo</p>
            </div>
            
            <!-- Body -->
            <div class="login-body">
                <!-- Mensaje de error -->
                <div th:if="${error}" class="alert alert-danger" role="alert">
                    <i class="bi bi-exclamation-triangle-fill"></i>
                    <span th:text="${error}"></span>
                </div>
                
                <!-- Mensaje de logout -->
                <div th:if="${message}" class="alert alert-success" role="alert">
                    <i class="bi bi-check-circle-fill"></i>
                    <span th:text="${message}"></span>
                </div>
                
                <!-- Formulario de login -->
                <form th:action="@{/login}" method="post">
                    <!-- Código -->
                    <div class="mb-3">
                        <label for="codigo" class="form-label">Código</label>
                        <input 
                            type="text" 
                            class="form-control" 
                            id="codigo" 
                            name="codigo" 
                            placeholder="Ingrese su código"
                            required
                            autofocus
                            maxlength="9"
                            pattern="[0-9]{9}"
                        >
                        <small class="form-text text-muted">9 dígitos</small>
                    </div>
                    
                    <!-- Password -->
                    <div class="mb-4">
                        <label for="password" class="form-label">Contraseña</label>
                        <input 
                            type="password" 
                            class="form-control" 
                            id="password" 
                            name="password" 
                            placeholder="Ingrese su contraseña"
                            required
                        >
                    </div>
                    
                    <!-- Submit -->
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-login">
                            Ingresar al Sistema
                        </button>
                    </div>
                </form>
                
                <!-- Footer info -->
                <div class="mt-4 text-center">
                    <small class="text-muted">
                        <p class="mb-1">📅 Fecha: <span th:text="${#temporals.format(#temporals.createNow(), 'dd/MM/yyyy')}"></span></p>
                        <p class="mb-0">v1.0.0 - 2026</p>
                    </small>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Bootstrap 5 JS -->
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
