<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title th:text="${pageTitle != null ? pageTitle + ' - ERP Admin' : 'ERP Admin V.1.0.0'}">ERP Admin</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/img/logo-icon.svg}">

    <!-- Restaura el estado de la barra (contraída o no) antes del primer pintado -->
    <script>
        (function () {
            var c = document.documentElement.classList;
            c.add('jb-no-anim');
            try { if (localStorage.getItem('jb.sidebar') === 'rail') { c.add('jb-rail'); } } catch (e) {}
        })();
    </script>

    <!-- Bootstrap CSS -->
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link th:href="@{/css/bootstrap-icons.min.css}" rel="stylesheet">

    <!-- Flatpickr CSS (Date Picker) -->
    <link th:href="@{/css/flatpickr.min.css}" rel="stylesheet">

    <!-- JBlueSoft: variables de diseño, tema de Bootstrap, estilos base y marco -->
    <link th:href="@{/css/jb-tokens.css}" rel="stylesheet">
    <link th:href="@{/css/bootstrap-theme.css}" rel="stylesheet">
    <link th:href="@{/css/common.css}" rel="stylesheet">
    <link th:href="@{/css/layout.css}" rel="stylesheet">
</head>

<body>
<!-- SIDEBAR -->
<nav th:fragment="sidebar" class="sidebar" id="sidebar" aria-label="Menú principal">
    <div class="sidebar-logo">
        <a th:href="@{/dashboard}" class="sidebar-brand">
            <img th:src="@{/img/logo-icon.svg}" alt="" width="32" height="32">
            <span class="sidebar-title">erpadmin</span>
        </a>
    </div>

    <div class="sidebar-menu">
        <!-- DASHBOARD (siempre visible, link directo) -->
        <a th:href="@{/dashboard}" class="menu-item" data-page="dashboard">
            <i class="bi bi-house-door" aria-hidden="true"></i>
            <span class="menu-label">Dashboard</span>
        </a>

        <!-- CATEGORÍA: ADMIN - Departamento (solo si ADMIN_DPTO) -->
        <div class="menu-group" sec:authorize="hasAnyRole('ADMIN_DPTO', 'ADMIN_SYS')">
            <button type="button" class="menu-category" aria-expanded="false" aria-controls="submenu-dpto">
                <i class="bi bi-person-badge" aria-hidden="true"></i>
                <span class="menu-label">ADMIN - <span th:text="${departamento != null ? departamento.descripcionCorta : 'Departamento'}">Depto 1</span></span>
                <i class="bi bi-chevron-down arrow" aria-hidden="true"></i>
            </button>
            <div class="submenu collapsed" id="submenu-dpto">
                <div class="submenu-inner">
                    <a th:href="@{/asistencia/registrar}" class="menu-item submenu-item" data-page="registrar">
                        <i class="bi bi-calendar-plus" aria-hidden="true"></i>
                        <span class="menu-label">REGISTRAR</span>
                    </a>
                    <a th:href="@{/asistencia/actualizar}" class="menu-item submenu-item" data-page="actualizar">
                        <i class="bi bi-pencil-square" aria-hidden="true"></i>
                        <span class="menu-label">ACTUALIZAR</span>
                    </a>
                    <a th:href="@{/asistencia/imprimir}" class="menu-item submenu-item" data-page="imprimir">
                        <i class="bi bi-printer" aria-hidden="true"></i>
                        <span class="menu-label">IMPRIMIR</span>
                    </a>
                    <a th:href="@{/almuerzo}" class="menu-item submenu-item" data-page="almuerzo">
                        <i class="bi bi-cup-hot" aria-hidden="true"></i>
                        <span class="menu-label">ALMUERZO</span>
                    </a>
                    <!-- ADMIN REGISTROS: ADMIN_SYS (cualquier fecha) y ADMIN_APP (solo hoy, ya
                         validado en el backend) -->
                    <a sec:authorize="hasAnyRole('ADMIN_SYS', 'ADMIN_APP')"
                       th:href="@{/asistencia/admin}"
                       class="menu-item submenu-item" data-page="asistencia-admin">
                        <i class="bi bi-journal-check" aria-hidden="true"></i>
                        <span class="menu-label">ADMIN REGISTROS</span>
                    </a>
                </div>
            </div>
        </div>

        <!-- CATEGORÍA: ADMIN APP (solo si ADMIN_APP) -->
        <div class="menu-group" sec:authorize="hasAnyRole('ADMIN_APP', 'ADMIN_SYS')">
            <button type="button" class="menu-category" aria-expanded="false" aria-controls="submenu-app">
                <i class="bi bi-grid-1x2" aria-hidden="true"></i>
                <span class="menu-label">Admin App</span>
                <i class="bi bi-chevron-down arrow" aria-hidden="true"></i>
            </button>
            <div class="submenu collapsed" id="submenu-app">
                <div class="submenu-inner">
                    <a th:href="@{/asistencia/consolidado}" class="menu-item submenu-item" data-page="consolidado">
                        <i class="bi bi-file-earmark-bar-graph" aria-hidden="true"></i>
                        <span class="menu-label">CONSOLIDADO</span>
                    </a>
                </div>
            </div>
        </div>

        <!-- CATEGORÍA: PERSONAL -->
        <div class="menu-group" sec:authorize="hasAnyRole('ADMIN_DPTO', 'ADMIN_APP', 'ADMIN_SYS')">
            <button type="button" class="menu-category" aria-expanded="false" aria-controls="submenu-personal">
                <i class="bi bi-people" aria-hidden="true"></i>
                <span class="menu-label">PERSONAL</span>
                <i class="bi bi-chevron-down arrow" aria-hidden="true"></i>
            </button>
            <div class="submenu collapsed" id="submenu-personal">
                <div class="submenu-inner">

                    <!-- LISTAR: todos los roles -->
                    <a th:href="@{/personal/listar}"
                       class="menu-item submenu-item" data-page="personal-listar">
                        <i class="bi bi-list-ul" aria-hidden="true"></i>
                        <span class="menu-label">LISTAR</span>
                    </a>

                    <!-- AGREGAR: solo ADMIN_APP y ADMIN_SYS -->
                    <a sec:authorize="hasAnyRole('ADMIN_APP', 'ADMIN_SYS')"
                       th:href="@{/personal/agregar}"
                       class="menu-item submenu-item" data-page="personal-agregar">
                        <i class="bi bi-person-plus" aria-hidden="true"></i>
                        <span class="menu-label">AGREGAR</span>
                    </a>

                    <!-- REGISTRAR: personal completamente nuevo, no existe en BD. Solo ADMIN_APP y ADMIN_SYS -->
                    <a sec:authorize="hasAnyRole('ADMIN_APP', 'ADMIN_SYS')"
                       th:href="@{/personal/registrar}"
                       class="menu-item submenu-item" data-page="personal-registrar">
                        <i class="bi bi-person-add" aria-hidden="true"></i>
                        <span class="menu-label">REGISTRAR NUEVO</span>
                    </a>

                </div>
            </div>
        </div>

        <!-- CATEGORÍA: USUARIOS — ADMIN_SYS (todos) y ADMIN_APP (solo ADMIN_DPTO de
             su unidad, ya validado en el backend) -->
        <div class="menu-group" sec:authorize="hasAnyRole('ADMIN_SYS', 'ADMIN_APP')">
            <button type="button" class="menu-category" aria-expanded="false" aria-controls="submenu-usuarios">
                <i class="bi bi-shield-lock" aria-hidden="true"></i>
                <span class="menu-label">USUARIOS</span>
                <i class="bi bi-chevron-down arrow" aria-hidden="true"></i>
            </button>
            <div class="submenu collapsed" id="submenu-usuarios">
                <div class="submenu-inner">

                    <a th:href="@{/asistencia/usuarios}"
                       class="menu-item submenu-item" data-page="usuarios-listar">
                        <i class="bi bi-person-lines-fill" aria-hidden="true"></i>
                        <span class="menu-label">LISTAR</span>
                    </a>

                    <a th:href="@{/asistencia/usuarios/crear}"
                       class="menu-item submenu-item" data-page="usuarios-crear">
                        <i class="bi bi-shield-plus" aria-hidden="true"></i>
                        <span class="menu-label">CREAR</span>
                    </a>

                </div>
            </div>
        </div>

        <!-- CATEGORÍA: SISTEMA (solo ADMIN_SYS) -->
        <div class="menu-group" sec:authorize="hasRole('ADMIN_SYS')">
            <button type="button" class="menu-category" aria-expanded="false" aria-controls="submenu-sistema">
                <i class="bi bi-gear" aria-hidden="true"></i>
                <span class="menu-label">SISTEMA</span>
                <i class="bi bi-chevron-down arrow" aria-hidden="true"></i>
            </button>
            <div class="submenu collapsed" id="submenu-sistema">
                <div class="submenu-inner">

                    <a th:href="@{/admin/etiquetas}" class="menu-item submenu-item">
                        <i class="bi bi-tags" aria-hidden="true"></i>
                        <span class="menu-label">ADMINISTRAR ETIQUETAS</span>
                    </a>

                    <!-- th:action agrega el token CSRF automáticamente (igual que logout) -->
                    <form th:action="@{/admin/etiquetas/refrescar}" method="post">
                        <button type="submit" class="menu-item submenu-item">
                            <i class="bi bi-arrow-clockwise" aria-hidden="true"></i>
                            <span class="menu-label">REFRESCAR ETIQUETAS</span>
                        </button>
                    </form>

                </div>
            </div>
        </div>

    </div>
</nav>

<!-- SIDEBAR OVERLAY (Mobile): cada pantalla incluye su propio
     <div class="sidebar-overlay" id="sidebarOverlay"></div> -->

<!-- TOP HEADER -->
<header th:fragment="header" class="top-header">
    <div class="header-left">
        <button type="button" class="menu-toggle" id="menuToggle"
                aria-controls="sidebar" aria-expanded="true" aria-label="Menú">
            <i class="bi bi-list" aria-hidden="true"></i>
        </button>
        <h2 class="header-title">
            <span th:text="${headerTitle != null ? headerTitle : 'Administrativo'}">Administrativo</span>
            <span th:if="${departamento != null}"> - </span>
            <span th:if="${departamento != null}" th:text="${departamento.descripcionCorta}"></span>
        </h2>
    </div>
    <div class="header-right">
        <span class="header-welcome d-none d-lg-inline">Bienvenido,</span>
        <div class="user-info" id="userMenu">
            <button type="button" class="user-trigger"
                    aria-haspopup="true" aria-expanded="false" aria-controls="userDropdown">
                <span class="user-avatar" aria-hidden="true">
                    <i class="bi bi-person-fill"></i>
                </span>
                <span class="user-name" sec:authentication="name">Usuario</span>
                <span class="jb-sr-only">Menú de usuario</span>
                <i class="bi bi-chevron-down user-chevron" aria-hidden="true"></i>
            </button>

            <!-- USER DROPDOWN -->
            <div class="user-dropdown" id="userDropdown">
                <div class="user-dropdown-header">
                    <strong sec:authentication="name">330501500</strong>
                    <small th:if="${departamento != null}" th:text="${departamento.descripcionCorta}">Depto Tecnológico</small>
                </div>

                <!--

                <a th:href="@{/perfil}" class="user-dropdown-item">
                    <i class="bi bi-person-circle"></i>
                    <span>Mi Perfil</span>
                </a>
                -->

                <a th:href="@{/asistencia/usuarios/mi-password}" class="user-dropdown-item">
                    <i class="bi bi-key" aria-hidden="true"></i>
                    <span>Cambiar Password</span>
                </a>
                <!--
                <a th:href="@{/configuracion}" class="user-dropdown-item">
                    <i class="bi bi-gear"></i>
                    <span>Configuración</span>
                </a>
                -->
                <div class="user-dropdown-divider"></div>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="user-dropdown-item is-danger">
                        <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
                        <span>Cerrar Sesión</span>
                    </button>
                </form>
            </div>
        </div>
    </div>
</header>

<!-- FOOTER -->
<footer th:fragment="footer" class="footer" id="footer">
    © 2026 erpadmin · JBlueSoft · v1.0.0
</footer>

<!-- SCRIPTS -->
<th:block th:fragment="scripts">
    <!-- Bootstrap JS -->
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>

    <!-- Flatpickr JS -->
    <script th:src="@{/js/flatpickr.min.js}"></script>
    <script th:src="@{/js/flatpickr-es.js}"></script>

    <!-- Marco: barra lateral, cajón móvil y menú de usuario -->
    <script th:src="@{/js/layout.js}"></script>
</th:block>
</body>
</html>
