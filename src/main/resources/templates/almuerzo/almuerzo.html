<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{layout :: head}"></th:block>

    <!-- Flatpickr para datepicker -->
    <link rel="stylesheet" th:href="@{/css/flatpickr.min.css}">

    <link th:href="@{/css/almuerzo.css}" rel="stylesheet">
</head>

<body>
<!-- SIDEBAR -->
<div th:replace="~{layout :: sidebar}"></div>

<!-- SIDEBAR OVERLAY -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- MAIN WRAPPER -->
<div class="main-wrapper">
    <!-- TOP HEADER -->
    <div th:replace="~{layout :: header}"></div>

    <!-- CONTENT AREA -->
    <div class="content-area">
        <!-- TITLE -->
        <h2 class="page-title">
            <i class="bi bi-egg-fried" aria-hidden="true"></i> ALMUERZO -
            <span th:text="${departamento.descripcionLarga}">DEPARTAMENTO</span>
        </h2>

        <!-- ALERTS -->
        <div th:if="${error}" class="alert-custom alert-danger">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span th:text="${error}"></span>
        </div>

        <!-- CONTROLES -->
        <div class="controls-bar">
            <div class="date-selector">
                <i class="bi bi-calendar3" aria-hidden="true"></i>
                <label for="fechaInput">Selecciona la fecha:</label>
                <input type="text"
                       id="fechaInput"
                       class="flatpickr-input"
                       th:value="${#temporals.format(fechaSeleccionada, 'dd-MM-yyyy')}"
                       placeholder="Seleccionar fecha"
                       readonly>
            </div>

            <button type="button" class="btn-institucional" onclick="irAImprimir()">
                <i class="bi bi-printer" aria-hidden="true"></i> Imprimir
            </button>
        </div>

        <!-- INFO MESSAGE -->
        <div class="alert-custom alert-info">
            <i class="bi bi-info-circle-fill" aria-hidden="true"></i>
            <span>
                <strong>Información:</strong> Esta lista muestra el personal que <strong>ASISTIÓ</strong>
                y recibirá almuerzo en la fecha seleccionada.
            </span>
        </div>

        <!-- CARDS DE RESUMEN -->
        <div th:if="${almuerzo != null}" class="stats-container">
            <!-- TOTAL GENERAL -->
            <div class="stat-card red">
                <div class="icon">
                    <i class="bi bi-people-fill" aria-hidden="true"></i>
                </div>
                <div class="number" th:text="${almuerzo.totalGeneral}">0</div>
                <div class="label">Total de Presentes</div>
                <div class="sublabel" th:text="${departamento.descripcionCorta}">DEPTO-1</div>
            </div>
        </div>

        <!-- MENSAJE SI NO HAY DATOS -->
        <div th:if="${almuerzo != null and almuerzo.totalGeneral == 0}"
             class="empty-state">
            <i class="bi bi-inbox" aria-hidden="true"></i>
            <p>
                No hay personal presente registrado para la fecha seleccionada.
            </p>
        </div>
    </div>
</div>

<!-- FOOTER -->
<div th:replace="~{layout :: footer}"></div>

<!-- SCRIPTS -->
<div th:replace="~{layout :: scripts}"></div>

<script>
    // Inicializar Flatpickr
    const fechaInput = flatpickr("#fechaInput", {
        dateFormat: "d-m-Y",
        locale: "es",
        onChange: function(selectedDates, dateStr, instance) {
            if (selectedDates.length > 0) {
                // Convertir a formato yyyy-MM-dd para el backend
                const fecha = selectedDates[0];
                const yyyy = fecha.getFullYear();
                const mm = String(fecha.getMonth() + 1).padStart(2, '0');
                const dd = String(fecha.getDate()).padStart(2, '0');
                const fechaISO = `${yyyy}-${mm}-${dd}`;

                // Recargar con nueva fecha
                window.location.href = '/almuerzo?fecha=' + fechaISO;
            }
        }
    });

    function irAImprimir() {
        const fecha = document.getElementById('fechaInput').value;
        if (!fecha) {
            alert('Por favor seleccione una fecha');
            return;
        }

        // Convertir dd-mm-yyyy a yyyy-mm-dd
        const parts = fecha.split('-');
        const fechaISO = `${parts[2]}-${parts[1]}-${parts[0]}`;

        window.open('/almuerzo/imprimir?fecha=' + fechaISO, '_blank');
    }
</script>
</body>
</html>
