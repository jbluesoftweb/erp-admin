<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{layout :: head}"></th:block>
    <link th:href="@{/css/personal-editar.css}" rel="stylesheet">
</head>

<body>
<div th:replace="~{layout :: sidebar}"></div>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="main-wrapper">
    <div th:replace="~{layout :: header}"></div>

    <div class="content-area">

        <!-- ALERTS -->
        <div th:if="${success}" class="alert-custom alert-success">
            <i class="bi bi-check-circle-fill"></i>
            <span th:text="${success}"></span>
        </div>
        <div th:if="${error}" class="alert-custom alert-danger">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span th:text="${error}"></span>
        </div>

        <a th:href="@{/personal/listar}" class="btn-cancelar">
            <i class="bi bi-arrow-left" aria-hidden="true"></i> Volver al listado
        </a>

        <div class="page-card">
            <div class="page-card-header">
                <i class="bi bi-pencil-square" aria-hidden="true"></i>
                <span th:text="${esAdminDepto ? 'Editar Cargo' : 'Editar Personal'}">Editar Personal</span>
                <small>ROLE: <span th:text="${rolActual}">XXXXX</span></small>
            </div>
            <div class="page-card-body">

                <!-- DATOS FIJOS: Código, DNI, Nombre (nunca editables) -->
                <div class="datos-fijos">
                    <div class="datos-fijos-title">
                        <i class="bi bi-lock-fill"></i> Datos de Identificación
                    </div>
                    <div class="dato-item">
                        <span class="dato-label">Código:</span>
                        <span class="dato-valor" th:text="${personal.codigo}"></span>
                        <span class="dato-label">DNI:</span>
                        <span class="dato-valor" th:text="${personal.dni}"></span>
                    </div>
                    <div class="dato-item">
                        <span class="dato-label">Nombre:</span>
                        <span class="dato-valor"
                              th:text="${personal.nivel.descripcionCorta + ' ' +
                                         personal.especialidad.descripcionCorta  + ' ' +
                                         personal.fullName}">
                        </span>
                        <!-- Badge tipo personal -->
                        <span th:if="${personal.especialidad.tipoPersonal.idTipoPersonal == 1}"
                              class="tipo-badge tipo-grupo1">G1</span>
                        <span th:if="${personal.especialidad.tipoPersonal.idTipoPersonal == 2}"
                              class="tipo-badge tipo-grupo2">G2</span>
                    </div>
                </div>

                <form th:action="@{/personal/editar/{id}(id=${personal.idPersonal})}"
                      method="post">
                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}"/>

                    <!-- ============================================ -->
                    <!-- SECCIÓN EXTENDIDA: ADMIN_APP y ADMIN_SYS    -->
                    <!-- ============================================ -->
                    <div th:if="${esAdminApp or esAdminSys}">

                        <div class="form-section-title">
                            <i class="bi bi-shield-fill"></i> Tipo de Personal
                        </div>

                        <!-- Selector TipoPersonal -->
                        <div class="form-row single">
                            <div class="form-group">
                                <label for="selectTipo">Tipo de Personal</label>
                                <select id="selectTipo" onchange="filtrarNivelesEspecialidades()">
                                    <option th:each="tp : ${tipoPersonales}"
                                            th:value="${tp.idTipoPersonal}"
                                            th:text="${tp.descripcionCorta + ' - ' + tp.descripcionLarga}"
                                            th:selected="${tp.idTipoPersonal == personal.especialidad.tipoPersonal.idTipoPersonal}">
                                    </option>
                                </select>
                            </div>
                        </div>

                        <div class="form-section-title">
                            <i class="bi bi-pencil"></i> Datos Profesionales
                        </div>

                        <!-- Nivel y Especialidad (filtrados por TipoPersonal) -->
                        <div class="form-row">
                            <div class="form-group">
                                <label for="selectNivel" th:text="${etiquetas['rrhh.personal.nivel']}">Nivel</label>
                                <select name="idNivel" id="selectNivel">
                                    <option th:each="g : ${niveles}"
                                            th:value="${g.idNivel}"
                                            th:text="${g.descripcionCorta + ' - ' + g.descripcionLarga}"
                                            th:attr="data-tipo=${g.tipoPersonal.idTipoPersonal}"
                                            th:selected="${g.idNivel == personal.nivel.idNivel}">
                                    </option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="selectEspecialidad" th:text="${etiquetas['rrhh.personal.especialidad']}">Especialidad</label>
                                <select name="idEspecialidad" id="selectEspecialidad">
                                    <option th:each="a : ${especialidades}"
                                            th:value="${a.idEspecialidad}"
                                            th:text="${a.descripcionCorta + ' - ' + a.descripcionLarga}"
                                            th:attr="data-tipo=${a.tipoPersonal.idTipoPersonal}"
                                            th:selected="${a.idEspecialidad == personal.especialidad.idEspecialidad}">
                                    </option>
                                </select>
                            </div>
                        </div>

                        <!-- Departamento y Antigüedad -->
                        <div class="form-row">
                            <div class="form-group">
                                <label for="idDepartamento" th:text="${etiquetas['rrhh.personal.departamento']}">Departamento</label>
                                <select id="idDepartamento" name="idDepartamento">
                                    <option th:each="c : ${departamentos}"
                                            th:value="${c.idDepartamento}"
                                            th:text="${c.descripcionCorta}"
                                            th:selected="${c.idDepartamento == personal.departamento.idDepartamento}">
                                    </option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="antiguedad">Antigüedad (años)</label>
                                <input type="number" id="antiguedad" name="antiguedad"
                                       min="0" max="20000"
                                       th:value="${personal.antiguedad}">
                            </div>
                        </div>
                    </div>

                    <!-- ============================================ -->
                    <!-- SECCIÓN SOLO LECTURA: ADMIN_DPTO            -->
                    <!-- ============================================ -->
                    <div th:if="${esAdminDepto}">
                        <div class="form-section-title">
                            <i class="bi bi-lock-fill"></i> Datos Profesionales (solo lectura)
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label th:text="${etiquetas['rrhh.personal.nivel']}">Nivel</label>
                                <input type="text"
                                       th:value="${personal.nivel.descripcionCorta + ' - ' + personal.nivel.descripcionLarga}"
                                       disabled>
                            </div>
                            <div class="form-group">
                                <label th:text="${etiquetas['rrhh.personal.especialidad']}">Especialidad</label>
                                <input type="text"
                                       th:value="${personal.especialidad.descripcionCorta + ' - ' + personal.especialidad.descripcionLarga}"
                                       disabled>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label th:text="${etiquetas['rrhh.personal.departamento']}">Departamento</label>
                                <input type="text"
                                       th:value="${personal.departamento.descripcionCorta}"
                                       disabled>
                            </div>
                            <div class="form-group">
                                <label>Antigüedad (años)</label>
                                <input type="number"
                                       th:value="${personal.antiguedad}"
                                       disabled>
                            </div>
                        </div>
                    </div>

                    <!-- ============================================ -->
                    <!-- CARGO: todos los roles pueden editar         -->
                    <!-- ============================================ -->
                    <div class="form-section-title">
                        <i class="bi bi-briefcase"></i> Cargo
                    </div>
                    <div class="form-row single">
                        <div class="form-group">
                            <label for="cargo">Cargo</label>
                            <input type="text" id="cargo" name="cargo"
                                   maxlength="50"
                                   th:value="${personal.cargo}"
                                   placeholder="Ej: Jefe de Departamento">
                        </div>
                    </div>

                    <!-- ACCIONES -->
                    <div class="form-actions">
                        <button type="submit" class="btn-institucional">
                            <i class="bi bi-check-lg" aria-hidden="true"></i> Actualizar
                        </button>
                        <a th:href="@{/personal/listar}" class="btn-cancelar">
                            <i class="bi bi-x-lg" aria-hidden="true"></i> Cancelar
                        </a>
                    </div>
                </form>

            </div>
        </div>

    </div>
</div>

<div th:replace="~{layout :: footer}"></div>
<div th:replace="~{layout :: scripts}"></div>


<script th:inline="none">
    const todosNiveles = [];
    const todasEspecialidades  = [];
</script>
<script th:inline="javascript">
    /*[# th:each="g : ${niveles}"]*/
    todosNiveles.push({
        idNivel:        [[${g.idNivel}]],
        descripcionCorta: [[${g.descripcionCorta}]],
        descripcionLarga: [[${g.descripcionLarga}]],
        idTipoPersonal:  [[${g.tipoPersonal.idTipoPersonal}]]
    });
    /*[/]*/
    /*[# th:each="a : ${especialidades}"]*/
    todasEspecialidades.push({
        idEspecialidad:          [[${a.idEspecialidad}]],
        descripcionCorta: [[${a.descripcionCorta}]],
        descripcionLarga: [[${a.descripcionLarga}]],
        idTipoPersonal:   [[${a.tipoPersonal.idTipoPersonal}]]
    });
    /*[/]*/

    function filtrarNivelesEspecialidades() {
        const tipoSeleccionado = parseInt(document.getElementById('selectTipo').value);
        const selectNivel = document.getElementById('selectNivel');
        const selectEspecialidad  = document.getElementById('selectEspecialidad');
        const nivelActual = selectNivel.value;
        const especialidadActual  = selectEspecialidad.value;

        selectNivel.innerHTML = '';
        todosNiveles.forEach(g => {
            if (g.idTipoPersonal === tipoSeleccionado) {
                const opt = document.createElement('option');
                opt.value = g.idNivel;
                opt.text  = g.descripcionCorta + ' - ' + g.descripcionLarga;
                if (g.idNivel == nivelActual) opt.selected = true;
                selectNivel.appendChild(opt);
            }
        });

        selectEspecialidad.innerHTML = '';
        todasEspecialidades.forEach(a => {
            if (a.idTipoPersonal === tipoSeleccionado) {
                const opt = document.createElement('option');
                opt.value = a.idEspecialidad;
                opt.text  = a.descripcionCorta + ' - ' + a.descripcionLarga;
                if (a.idEspecialidad == especialidadActual) opt.selected = true;
                selectEspecialidad.appendChild(opt);
            }
        });
    }

    document.addEventListener('DOMContentLoaded', filtrarNivelesEspecialidades);
</script>


</body>
</html>
