<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{layout :: head}"></th:block>
    <link th:href="@{/css/personal-listar.css}" rel="stylesheet">
</head>

<body>
<div th:replace="~{layout :: sidebar}"></div>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="main-wrapper">
    <div th:replace="~{layout :: header}"></div>

    <div class="content-area">

        <!-- ALERTS -->
        <div th:if="${success}" class="alert-custom alert-success">
            <i class="bi bi-check-circle-fill"></i>
            <span th:text="${success}"></span>
        </div>
        <div th:if="${error}" class="alert-custom alert-danger">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span th:text="${error}"></span>
        </div>

        <!-- CONTROLES -->
        <div class="controls-bar">
            <div class="controls-left">
                <form th:action="@{/personal/listar}" method="get" class="filtros-form">

                    <!-- Filtro Departamento: solo ADMIN_APP y ADMIN_SYS -->
                    <div class="filter-group" th:if="${esAdminSys or esAdminApp}">
                        <label for="filtroDepartamento">Por Departamento:</label>
                        <select id="filtroDepartamento" name="idDepartamento" onchange="this.form.submit()">
                            <option value="">-- todas --</option>
                            <option th:each="c : ${departamentos}"
                                    th:value="${c.idDepartamento}"
                                    th:text="${c.descripcionCorta}"
                                    th:selected="${c.idDepartamento == idDepartamentoSeleccionada}">
                            </option>
                        </select>
                    </div>

                    <!-- Búsqueda: todos los roles -->
                    <div class="filter-group">
                        <label for="filtroBuscar">Buscar:</label>
                        <input type="text" id="filtroBuscar" name="buscar"
                               th:value="${buscar}"
                               placeholder="Código o apellidos...">
                        <button type="submit" class="btn-institucional" aria-label="Buscar">
                            <i class="bi bi-search" aria-hidden="true"></i>
                        </button>
                    </div>
                </form>
            </div>

            <!-- Acciones derecha -->
            <div class="controls-right">
                <span class="badge-total">
                    <i class="bi bi-people-fill" aria-hidden="true"></i>
                    Total: <span th:text="${listaPersonal.size()}">0</span>
                </span>
                <!-- Agregar: solo ADMIN_APP y ADMIN_SYS -->
                <a th:if="${esAdminSys or esAdminApp}"
                   th:href="@{/personal/agregar}" class="btn-institucional-gold">
                    <i class="bi bi-person-plus-fill" aria-hidden="true"></i> Agregar
                </a>
            </div>
        </div>

        <!-- TÍTULO -->
        <div class="section-title">
            <i class="bi bi-people-fill"></i>
            <span th:text="${headerTitle}">Personal</span>
        </div>

        <!-- TABLA -->
        <div class="data-table personal-table">
            <table>
                <thead>
                <tr>
                    <th class="col-num">N°</th>
                    <th class="col-datos-generales">DATOS GENERALES</th>
                    <th class="col-dpto" th:text="${etiquetas['rrhh.personal.departamento']}">Departamento</th>
                    <th class="td-acciones">ACCIONES</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${listaPersonal.isEmpty()}">
                    <td colspan="4">
                        <div class="empty-state">
                            <i class="bi bi-person-x"></i>
                            <p>No se encontró personal registrado.</p>
                        </div>
                    </td>
                </tr>

                <tr th:each="p, iter : ${listaPersonal}">
                    <td class="td-num" th:text="${iter.count}">1</td>
                    <td class="td-datos">
                            <span th:text="${p.nivel.descripcionCorta + ' ' +
                                            p.especialidad.descripcionCorta  + ' ' +
                                            p.fullName}">
                            </span>
                        <small th:if="${p.cargo != null and !p.cargo.isEmpty()}"
                               th:text="${p.cargo}"></small>
                    </td>
                    <td class="td-departamento" th:text="${p.departamento.descripcionCorta}">DEPTO-1</td>
                    <td class="td-acciones">
                        <!-- Editar: todos los roles -->
                        <a th:href="@{/personal/editar/{id}(id=${p.idPersonal})}"
                           class="btn btn-sm btn-primary">
                            <i class="bi bi-pencil-fill" aria-hidden="true"></i>
                            <!-- Label dinámico: ADMIN_DPTO solo edita cargo -->
                            <span th:text="${esAdminDepto ? 'Cargo' : 'Editar'}"></span>
                        </a>

                        <!-- Mover a SIN_EMPRESA: ADMIN_SYS y ADMIN_APP (ADMIN_APP solo ve esto para personal de su propia unidad, ya filtrado en listaPersonal) -->
                        <form th:if="${esAdminSys or esAdminApp}"
                              th:action="@{/personal/mover-sin-unidad/{id}(id=${p.idPersonal})}"
                              method="post"
                              th:data-nombre="${p.fullName}"
                              onsubmit="return confirmarMover(this)">


                            <input type="hidden"
                                   th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-sm btn-secondary"
                                    title="Mover a SIN_EMPRESA">
                                <i class="bi bi-box-arrow-right" aria-hidden="true"></i> S/U
                            </button>
                        </form>

                    </td>
                </tr>
                </tbody>
            </table>
        </div>

    </div>
</div>

<div th:replace="~{layout :: footer}"></div>
<div th:replace="~{layout :: scripts}"></div>

<script>
    function confirmarMover(form) {
        const nombre = form.getAttribute('data-nombre');
        return confirm('¿Mover a SIN_EMPRESA a:\n' + nombre + '?\n\n' +
            'El personal quedará disponible para ser incorporado por otra unidad.');
    }
</script>
</body>
</html>
