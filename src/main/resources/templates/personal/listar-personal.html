<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{layout :: head}"></th:block>
    <style>
        .td-acciones {
            text-align: center;
            white-space: nowrap;
            width: 200px;
        }
        .btn-editar {
            background: #2d5016;
            color: white;
            border: none;
            padding: 5px 14px;
            font-size: 12px;
            border-radius: 3px;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s;
            display: inline-block;
        }
        .btn-editar:hover { background: #3d6b1f; color: white; }
        .btn-mover {
            background: #856404;
            color: white;
            border: none;
            padding: 5px 14px;
            font-size: 12px;
            border-radius: 3px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-mover:hover { background: #6d5202; }
        .badge-total {
            background: #2d5016;
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
    </style>
</head>

<body>
<div th:replace="~{layout :: sidebar}"></div>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="main-wrapper">
    <div th:replace="~{layout :: header}"></div>

    <div class="content-area">

        <!-- ALERTS -->
        <div th:if="${success}" class="alert-custom alert-success">
            <i class="bi bi-check-circle-fill"></i>
            <span th:text="${success}"></span>
        </div>
        <div th:if="${error}" class="alert-custom alert-danger">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span th:text="${error}"></span>
        </div>

        <!-- CONTROLES -->
        <div class="controls-bar">
            <div class="controls-left">
                <form th:action="@{/personal/listar}" method="get"
                      style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">

                    <!-- Filtro Departamento: solo ADMIN_APP y ADMIN_SYS -->
                    <div class="filter-group" th:if="${esAdminSys or esAdminApp}">
                        <label>Por Departamento:</label>
                        <select name="idDepartamento" onchange="this.form.submit()"
                                style="min-width:140px;">
                            <option value="">-- todas --</option>
                            <option th:each="c : ${departamentos}"
                                    th:value="${c.idDepartamento}"
                                    th:text="${c.descripcionCorta}"
                                    th:selected="${c.idDepartamento == idDepartamentoSeleccionada}">
                            </option>
                        </select>
                    </div>

                    <!-- Búsqueda: todos los roles -->
                    <div class="filter-group">
                        <label>Buscar:</label>
                        <input type="text" name="buscar"
                               th:value="${buscar}"
                               placeholder="Código o apellidos..."
                               style="min-width:200px;">
                        <button type="submit" class="btn-institucional">
                            <i class="bi bi-search"></i>
                        </button>
                    </div>
                </form>
            </div>

            <!-- Acciones derecha -->
            <div style="display:flex; align-items:center; gap:15px;">
                <span class="badge-total">
                    <i class="bi bi-people-fill"></i>
                    Total: <span th:text="${listaPersonal.size()}">0</span>
                </span>
                <!-- Agregar: solo ADMIN_APP y ADMIN_SYS -->
                <a th:if="${esAdminSys or esAdminApp}"
                   th:href="@{/personal/agregar}" class="btn-institucional-gold">
                    <i class="bi bi-person-plus-fill"></i> Agregar
                </a>
            </div>
        </div>

        <!-- TÍTULO -->
        <div class="section-title">
            <i class="bi bi-people-fill"></i>
            <span th:text="${headerTitle}">Personal</span>
        </div>

        <!-- TABLA -->
        <div class="data-table">
            <table>
                <thead>
                <tr>
                    <th style="width:50px;">N°</th>
                    <th style="text-align:left; padding-left:15px;">DATOS GENERALES</th>
                    <th style="width:100px;" th:text="${etiquetas['rrhh.personal.departamento']}">Departamento</th>
                    <th style="width:200px;">ACCIONES</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${listaPersonal.isEmpty()}">
                    <td colspan="4">
                        <div class="empty-state">
                            <i class="bi bi-person-x"></i>
                            <p>No se encontró personal registrado.</p>
                        </div>
                    </td>
                </tr>

                <tr th:each="p, iter : ${listaPersonal}">
                    <td class="td-num" th:text="${iter.count}">1</td>
                    <td class="td-datos">
                            <span th:text="${p.nivel.descripcionCorta + ' ' +
                                            p.especialidad.descripcionCorta  + ' ' +
                                            p.fullName}">
                            </span>
                        <small th:if="${p.cargo != null and !p.cargo.isEmpty()}"
                               th:text="${p.cargo}"></small>
                    </td>
                    <td class="td-departamento" th:text="${p.departamento.descripcionCorta}">DEPTO-1</td>
                    <td class="td-acciones">
                        <!-- Editar: todos los roles -->
                        <a th:href="@{/personal/editar/{id}(id=${p.idPersonal})}"
                           class="btn-editar">
                            <i class="bi bi-pencil-fill"></i>
                            <!-- Label dinámico: ADMIN_DPTO solo edita cargo -->
                            <span th:text="${esAdminDepto ? 'Cargo' : 'Editar'}"></span>
                        </a>

                        <!-- Mover a SIN_EMPRESA: ADMIN_SYS y ADMIN_APP (ADMIN_APP solo ve esto para personal de su propia unidad, ya filtrado en listaPersonal) -->
                        <form th:if="${esAdminSys or esAdminApp}"
                              th:action="@{/personal/mover-sin-unidad/{id}(id=${p.idPersonal})}"
                              method="post" style="display:inline;"
                              th:data-nombre="${p.fullName}"
                              onsubmit="return confirmarMover(this)">


                            <input type="hidden"
                                   th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}"/>
                            <button type="submit" class="btn-mover">
                                <i class="bi bi-box-arrow-right"></i> S/U
                            </button>
                        </form>

                    </td>
                </tr>
                </tbody>
            </table>
        </div>

    </div>
</div>

<div th:replace="~{layout :: footer}"></div>
<div th:replace="~{layout :: scripts}"></div>

<script>
    function confirmarMover(form) {
        const nombre = form.getAttribute('data-nombre');
        return confirm('¿Mover a SIN_EMPRESA a:\n' + nombre + '?\n\n' +
            'El personal quedará disponible para ser incorporado por otra unidad.');
    }
</script>
</body>
</html>
