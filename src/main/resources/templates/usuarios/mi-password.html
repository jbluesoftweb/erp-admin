<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{layout :: head}"></th:block>
    <link th:href="@{/css/usuarios-mi-password.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{layout :: sidebar}"></div>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="main-wrapper">
    <div th:replace="~{layout :: header}"></div>
    <div class="content-area">

        <div th:if="${success}" class="alert-custom alert-success">
            <i class="bi bi-check-circle-fill"></i>
            <span th:text="${success}"></span>
        </div>
        <div th:if="${error}" class="alert-custom alert-danger">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span th:text="${error}"></span>
        </div>

        <div class="page-card">
            <div class="page-card-header">
                <i class="bi bi-lock-fill" aria-hidden="true"></i>
                <span>Cambiar Mi Contraseña</span>
            </div>
            <div class="page-card-body">

                <form th:action="@{/asistencia/usuarios/mi-password}"
                      method="post">
                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}"/>

                    <div class="form-group">
                        <label for="passwordActual">Contraseña Actual</label>
                        <input type="password" id="passwordActual" name="passwordActual"
                               required autocomplete="current-password"
                               placeholder="Tu contraseña actual">
                    </div>

                    <hr class="divider">

                    <div class="form-group">
                        <label for="nuevaPassword">Nueva Contraseña</label>
                        <input type="password" id="nuevaPassword" name="nuevaPassword"
                               minlength="8"
                               required autocomplete="new-password"
                               aria-describedby="nuevaPasswordAyuda"
                               placeholder="Tu nueva contraseña">
                        <span class="field-hint" id="nuevaPasswordAyuda">Mínimo 8 caracteres, con al menos 1 número y 1 carácter especial (por ejemplo: ! @ # $ % &amp; *).</span>
                    </div>
                    <div class="form-group">
                        <label for="confirmarPassword">Confirmar Nueva Contraseña</label>
                        <input type="password" id="confirmarPassword" name="confirmarPassword"
                               minlength="8"
                               required autocomplete="new-password"
                               placeholder="Repite la nueva contraseña">
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-institucional">
                            <i class="bi bi-check-lg" aria-hidden="true"></i> Cambiar Contraseña
                        </button>
                        <a th:href="@{/dashboard}" class="btn-cancelar">
                            <i class="bi bi-x-lg" aria-hidden="true"></i> Cancelar
                        </a>
                    </div>
                </form>

            </div>
        </div>

    </div>
</div>

<div th:replace="~{layout :: footer}"></div>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
