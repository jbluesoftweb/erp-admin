<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{layout :: head}"></th:block>
    <style>
        .page-card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-bottom: 25px;
            overflow: hidden;
            max-width: 500px;
        }
        .page-card-header {
            background: linear-gradient(90deg, #2d5016 0%, #3d6b1f 100%);
            padding: 14px 20px;
            border-left: 4px solid #d4af37;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .page-card-header span {
            color: white;
            font-size: 15px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .page-card-body { padding: 25px 30px; }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 18px;
        }
        .form-group label {
            font-size: 12px;
            font-weight: 600;
            color: #444;
            text-transform: uppercase;
        }
        .form-group input {
            padding: 9px 12px;
            font-size: 13px;
            border: 1px solid #ccc;
            border-radius: 4px;
            color: #333;
        }
        .form-group input:focus {
            outline: none;
            border-color: #2d5016;
            box-shadow: 0 0 0 2px rgba(45,80,22,0.12);
        }
        .form-actions {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        .btn-guardar {
            background: #2d5016;
            color: white;
            border: none;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-guardar:hover { background: #3d6b1f; }
        .btn-cancelar {
            color: #666;
            font-size: 13px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .alert-custom {
            padding: 12px 18px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }
        .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-danger  { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .divider { border: none; border-top: 1px solid #eee; margin: 20px 0; }
    </style>
</head>
<body>
<div th:replace="~{layout :: sidebar}"></div>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="main-wrapper">
    <div th:replace="~{layout :: header}"></div>
    <div class="content-area">

        <div th:if="${success}" class="alert-custom alert-success">
            <i class="bi bi-check-circle-fill"></i>
            <span th:text="${success}"></span>
        </div>
        <div th:if="${error}" class="alert-custom alert-danger">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span th:text="${error}"></span>
        </div>

        <div class="page-card">
            <div class="page-card-header">
                <i class="bi bi-lock-fill" style="color:#d4af37;"></i>
                <span>Cambiar Mi Contraseña</span>
            </div>
            <div class="page-card-body">

                <form th:action="@{/asistencia/usuarios/mi-password}"
                      method="post">
                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}"/>

                    <div class="form-group">
                        <label>Contraseña Actual</label>
                        <input type="password" name="passwordActual"
                               required autocomplete="current-password"
                               placeholder="Tu contraseña actual">
                    </div>

                    <hr class="divider">

                    <div class="form-group">
                        <label>Nueva Contraseña</label>
                        <input type="password" name="nuevaPassword"
                               minlength="6"
                               required autocomplete="new-password"
                               placeholder="Mínimo 8 caracteres, 1 número y 1 carácter especial">
                    </div>
                    <div class="form-group">
                        <label>Confirmar Nueva Contraseña</label>
                        <input type="password" name="confirmarPassword"
                               minlength="6"
                               required autocomplete="new-password"
                               placeholder="Repite la nueva contraseña">
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-guardar">
                            <i class="bi bi-check-lg"></i> Cambiar Contraseña
                        </button>
                        <a th:href="@{/dashboard}" class="btn-cancelar">
                            <i class="bi bi-x-lg"></i> Cancelar
                        </a>
                    </div>
                </form>

            </div>
        </div>

    </div>
</div>

<div th:replace="~{layout :: footer}"></div>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
