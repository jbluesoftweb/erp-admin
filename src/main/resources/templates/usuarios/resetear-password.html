<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{layout :: head}"></th:block>
    <link th:href="@{/css/usuarios-resetear-password.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{layout :: sidebar}"></div>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="main-wrapper">
    <div th:replace="~{layout :: header}"></div>
    <div class="content-area">

        <div th:if="${error}" class="alert-custom alert-danger">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span th:text="${error}"></span>
        </div>

        <a th:href="@{/asistencia/usuarios}" class="btn-cancelar">
            <i class="bi bi-arrow-left" aria-hidden="true"></i> Volver al listado
        </a>

        <div class="alert-custom alert-warning">
            <i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i>
            <span>
                Esta acción reemplaza la contraseña actual del usuario sin necesidad
                de conocer la anterior. Úsela solo cuando sea necesario.
            </span>
        </div>

        <div class="page-card">
            <div class="page-card-header">
                <i class="bi bi-key-fill" aria-hidden="true"></i>
                <span>Resetear Contraseña</span>
            </div>
            <div class="page-card-body">

                <!-- DATOS DEL USUARIO -->
                <div class="datos-fijos">
                    <div class="datos-fijos-title">
                        <i class="bi bi-person-fill"></i> Usuario
                    </div>
                    <div class="dato-item">
                        <span class="dato-label">Código:</span>
                        <span class="dato-valor" th:text="${usuario.codigo}"></span>
                    </div>
                    <div class="dato-item" th:if="${usuario.personal != null}">
                        <span class="dato-label">Nombre:</span>
                        <span class="dato-valor"
                              th:text="${usuario.personal.fullName}">
                        </span>
                    </div>
                </div>

                <form th:action="@{/asistencia/usuarios/resetear-password/{id}(id=${usuario.idUsuario})}"
                      method="post">
                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}"/>

                    <div class="form-group">
                        <label for="nuevaPassword">Nueva Contraseña</label>
                        <input type="password" id="nuevaPassword" name="nuevaPassword"
                               minlength="8"
                               placeholder="Nueva contraseña"
                               aria-describedby="nuevaPasswordAyuda"
                               required autocomplete="new-password">
                        <span class="field-hint" id="nuevaPasswordAyuda">Mínimo 8 caracteres, con al menos 1 número y 1 carácter especial (por ejemplo: ! @ # $ % &amp; *).</span>
                    </div>
                    <div class="form-group">
                        <label for="confirmarPassword">Confirmar Contraseña</label>
                        <input type="password" id="confirmarPassword" name="confirmarPassword"
                               minlength="8"
                               placeholder="Repite la contraseña"
                               required autocomplete="new-password">
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-key-fill" aria-hidden="true"></i> Resetear Contraseña
                        </button>
                        <a th:href="@{/asistencia/usuarios}" class="btn-cancelar">
                            <i class="bi bi-x-lg" aria-hidden="true"></i> Cancelar
                        </a>
                    </div>
                </form>

            </div>
        </div>

    </div>
</div>

<div th:replace="~{layout :: footer}"></div>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
