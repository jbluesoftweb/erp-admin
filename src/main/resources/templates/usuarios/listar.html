<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{layout :: head}"></th:block>
    <link th:href="@{/css/usuarios-listar.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{layout :: sidebar}"></div>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="main-wrapper">
    <div th:replace="~{layout :: header}"></div>
    <div class="content-area">

        <div th:if="${success}" class="alert-custom alert-success">
            <i class="bi bi-check-circle-fill"></i>
            <span th:text="${success}"></span>
        </div>
        <div th:if="${error}" class="alert-custom alert-danger">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span th:text="${error}"></span>
        </div>

        <div class="controls-bar">
            <span class="badge-total">
                <i class="bi bi-people-fill" aria-hidden="true"></i>
                Total: <strong th:text="${usuarios.size()}">0</strong> usuarios
            </span>
            <a th:href="@{/asistencia/usuarios/crear}" class="btn-institucional-gold">
                <i class="bi bi-person-plus-fill" aria-hidden="true"></i> Crear Usuario
            </a>
        </div>

        <div class="page-card">
            <div class="page-card-header">
                <i class="bi bi-shield-lock-fill" aria-hidden="true"></i>
                <span>Usuarios ERP Admin</span>
            </div>
            <div class="data-table usuarios-table">
            <table>
                <thead>
                <tr>
                    <th>Código</th>
                    <th class="col-nombre">Nombre</th>
                    <th th:text="${etiquetas['rrhh.personal.departamento']}">Departamento</th>
                    <th>Email</th>
                    <th>Rol</th>
                    <th>Estado</th>
                    <th class="td-acciones">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${usuarios.isEmpty()}">
                    <td colspan="7" class="td-empty">
                        No hay usuarios registrados.
                    </td>
                </tr>
                <tr th:each="u : ${usuarios}">
                    <td><strong th:text="${u.codigo}"></strong></td>

                    <td>
                            <span th:if="${u.personal != null}"
                                  th:text="${u.personal.nivel.descripcionCorta
                                           + ' ' + u.personal.especialidad.descripcionCorta
                                           + ' ' + u.personal.fullName}">
                            </span>
                        <span th:if="${u.personal == null}"
                              class="texto-secundario">Sin personal asignado</span>
                    </td>

                    <td>
                            <span th:if="${u.personal != null}"
                                  th:text="${u.personal.departamento.descripcionCorta}">
                            </span>
                    </td>
                    <td class="td-email" th:text="${u.email ?: '-'}"></td>

                    <td>
                        <span th:with="rol=${rolesMap[u.idUsuario]}"
                              class="badge-rol"
                              th:classappend="${rol == 'ADMIN_SYS'  ? 'rol-admin-sys'  :
                                               rol == 'ADMIN_APP'   ? 'rol-admin-app'  :
                                               rol == 'ADMIN_DPTO'  ? 'rol-admin-dpto' :
                                               rol == 'JEFE_DPTO'   ? 'rol-jefe-dpto'  : ''}"
                              th:text="${rol ?: 'Sin rol'}">
                        </span>
                    </td>

                    <td>
                            <span th:if="${u.enabled}"
                                  class="badge-estado activo">Activo</span>
                        <span th:if="${!u.enabled}"
                              class="badge-estado inactivo">Inactivo</span>
                    </td>

                    <td class="td-acciones">
                        <a th:href="@{/asistencia/usuarios/editar/{id}(id=${u.idUsuario})}"
                           class="btn btn-sm btn-primary">
                            <i class="bi bi-pencil-fill" aria-hidden="true"></i> Editar
                        </a>
                        <a th:href="@{/asistencia/usuarios/resetear-password/{id}(id=${u.idUsuario})}"
                           class="btn btn-sm btn-outline-primary">
                            <i class="bi bi-key-fill" aria-hidden="true"></i> Password
                        </a>

                        <form th:if="${u.enabled}"
                              th:action="@{/asistencia/usuarios/deshabilitar/{id}(id=${u.idUsuario})}"
                              method="post"
                              th:data-nombre="${u.codigo}"
                              onsubmit="return confirmarDeshabilitar(this)">
                            <input type="hidden"
                                   th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-sm btn-outline-danger">
                                <i class="bi bi-person-x-fill" aria-hidden="true"></i> Deshabilitar
                            </button>
                        </form>

                        <form th:if="${!u.enabled}"
                              th:action="@{/asistencia/usuarios/reactivar/{id}(id=${u.idUsuario})}"
                              method="post">
                            <input type="hidden"
                                   th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-sm btn-success">
                                <i class="bi bi-person-check-fill" aria-hidden="true"></i> Reactivar
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
            </div>
        </div>

    </div>
</div>

<div th:replace="~{layout :: footer}"></div>
<div th:replace="~{layout :: scripts}"></div>
<script>
    function confirmarDeshabilitar(form) {
        const codigo = form.getAttribute('data-nombre');
        return confirm('¿Deshabilitar al usuario con código: ' + codigo + '?\n\n' +
            'No podrá iniciar sesión hasta que sea reactivado.');
    }
</script>
</body>
</html>
