<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{layout :: head}"></th:block>
    <link th:href="@{/css/usuarios-editar.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{layout :: sidebar}"></div>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="main-wrapper">
    <div th:replace="~{layout :: header}"></div>
    <div class="content-area">

        <div th:if="${success}" class="alert-custom alert-success">
            <i class="bi bi-check-circle-fill"></i>
            <span th:text="${success}"></span>
        </div>
        <div th:if="${error}" class="alert-custom alert-danger">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span th:text="${error}"></span>
        </div>

        <a th:href="@{/asistencia/usuarios}" class="btn-cancelar">
            <i class="bi bi-arrow-left" aria-hidden="true"></i> Volver al listado
        </a>

        <div class="page-card">
            <div class="page-card-header">
                <i class="bi bi-pencil-square" aria-hidden="true"></i>
                <span>Editar Usuario</span>
            </div>
            <div class="page-card-body">

                <!-- DATOS FIJOS -->
                <div class="datos-fijos">
                    <div class="datos-fijos-title">
                        <i class="bi bi-lock-fill"></i> Datos de Identificación
                    </div>
                    <div class="dato-item">
                        <span class="dato-label">Código:</span>
                        <span class="dato-valor" th:text="${usuario.codigo}"></span>
                    </div>
                    <div class="dato-item" th:if="${usuario.personal != null}">
                        <span class="dato-label">Nombre:</span>
                        <span class="dato-valor"
                              th:text="${usuario.personal.nivel.descripcionCorta
                                       + ' ' + usuario.personal.especialidad.descripcionCorta
                                       + ' ' + usuario.personal.fullName}">
                        </span>
                    </div>
                    <div class="dato-item" th:if="${usuario.personal != null}">
                        <span class="dato-label">Departamento:</span>
                        <span class="dato-valor"
                              th:text="${usuario.personal.departamento.descripcionCorta}">
                        </span>
                    </div>
                    <div class="dato-item">
                        <span class="dato-label">Rol actual:</span>
                        <span th:each="reg : ${registros}"
                              class="badge-rol"
                              th:classappend="${reg.rol.codigo == 'ADMIN_SYS' ? 'rol-admin-sys' :
                                               reg.rol.codigo == 'ADMIN_APP' ? 'rol-admin-app' :
                                               reg.rol.codigo == 'ADMIN_DPTO'? 'rol-admin-dpto':
                                               reg.rol.codigo == 'JEFE_DPTO' ? 'rol-jefe-dpto' : ''}"
                              th:text="${reg.rol.codigo}">
                        </span>
                    </div>
                </div>

                <!-- SECCIÓN EMAIL -->
                <div class="form-section-title">
                    <i class="bi bi-envelope"></i> Actualizar Email
                </div>
                <form th:action="@{/asistencia/usuarios/editar/{id}/email(id=${usuario.idUsuario})}"
                      method="post">
                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}"/>
                    <div class="form-row single">
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email"
                                   maxlength="100"
                                   th:value="${usuario.email}"
                                   placeholder="usuario@tuinstitucion.gob.pe">
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn-institucional">
                            <i class="bi bi-check-lg" aria-hidden="true"></i> Actualizar Email
                        </button>
                    </div>
                </form>

                <hr class="section-divider">

                <!-- SECCIÓN ROL -->
                <div class="form-section-title">
                    <i class="bi bi-shield-fill"></i> Cambiar Rol en ERP Admin
                </div>
                <form th:action="@{/asistencia/usuarios/editar/{id}/rol(id=${usuario.idUsuario})}"
                      method="post">
                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}"/>
                    <div class="form-row single">
                        <div class="form-group">
                            <label for="idRol">Nuevo Rol</label>
                            <select id="idRol" name="idRol" required>
                                <option value="">-- selecciona --</option>
                                <option th:each="r : ${roles}"
                                        th:value="${r.idRol}"
                                        th:text="${r.codigo + ' — ' + r.descripcion}"
                                        th:selected="${registros != null
                                                      and !registros.isEmpty()
                                                      and registros[0].rol.idRol == r.idRol}">
                                </option>
                            </select>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn-institucional">
                            <i class="bi bi-check-lg" aria-hidden="true"></i> Cambiar Rol
                        </button>
                    </div>
                </form>

            </div>
        </div>

    </div>
</div>

<div th:replace="~{layout :: footer}"></div>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
